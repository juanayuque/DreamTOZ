<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style2.css">
    <title>Dream MS Tower of Oz Music Practice</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="backgroundContainer"></div>

    <header class="site-nav">
        <div class="nav-inner">
            <a href="index.html" class="brand">
                <img src="maple-leaf.png" alt="">
                <span>Dream MS Tower of Oz Music</span>
            </a>
            <nav class="nav-links" aria-label="Main navigation">
                <a href="index.html">Songs</a>
                <a href="practice.html" class="active">Practice</a>
            </nav>
        </div>
    </header>

    <main class="practice-shell">
        <section class="practice-panel" id="setupPanel">
            <p class="eyebrow">Practice Mode</p>
            <h1>Guess the song</h1>
            <p class="setup-copy">Choose how strict you want the test to be.</p>
            <div class="mode-actions">
                <button id="hintModeBtn" type="button">With hints</button>
                <button id="noHintModeBtn" type="button">No hints</button>
            </div>
        </section>

        <section class="practice-panel game-container" id="gameContainer">
            <div class="game-header">
                <div>
                    <p id="modeDisplay" class="mode-label">Hints: 3 choices</p>
                    <h1 id="roundDisplay">Round: 0/10</h1>
                </div>
                <button id="restartBtn" class="restart-btn" type="button">
                    <i class="fas fa-sync-alt"></i>
                    Restart
                </button>
            </div>

            <audio id="audioPlayer" controls></audio>

            <div id="options" class="options"></div>

            <form id="typedAnswerForm" class="typed-answer">
                <label for="typedAnswer">Town name</label>
                <div class="typed-row">
                    <input id="typedAnswer" type="text" autocomplete="off" placeholder="Type town name">
                    <button type="submit">Submit</button>
                </div>
            </form>

            <div id="feedback" class="feedback"></div>
            <p id="scoreDisplay" class="score-display">Score: 0/10</p>
        </section>

        <section class="practice-panel final-panel" id="finalPanel">
            <p class="eyebrow">Results</p>
            <h1 id="finalMessage">You scored 0/10.</h1>
            <button id="playAgainBtn" class="restart-btn" type="button">Play again</button>
        </section>
    </main>

    <script src="songs.js"></script>
    <script src="practice.js"></script>
</body>
</html>
