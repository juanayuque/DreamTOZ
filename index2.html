<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Maple DJ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #fdfdfd;
            color: #222;
        }

        nav {
            background-color: #111;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h1 {
            font-size: 1.5rem;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 1.5rem;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        nav ul li a:hover {
            color: #00c9a7;
        }

        .section {
            padding: 1rem;
            max-width: 1000px;
            margin: auto;
        }

        .now-playing {
            font-size: 1.2rem;
            margin-bottom: 1rem;
        }

        .style-options {
            margin-bottom: 1rem;
        }

        .style-options span {
            font-weight: bold;
            margin-right: 0.5rem;
        }

        .style-options button {
            margin-right: 1rem;
            padding: 0.5rem 1rem;
            border: 1px solid #ddd;
            background-color: #f9f9f9;
            cursor: pointer;
            border-radius: 20px;
            transition: background-color 0.2s;
        }

        .style-options button:hover {
            background-color: #00c9a7;
            color: white;
        }

        .filters {
            margin-bottom: 2rem;
        }

        .filters select {
            padding: 0.5rem;
            margin-right: 1rem;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        #content {
            /* This is where we’ll dynamically load List, Palette, or Map views */
        }
    </style>
</head>
<body>

    <nav>
        <h1>Maple DJ 🎧🍁</h1>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Practice</a></li>
        </ul>
    </nav>

    <div class="section">
        <div class="now-playing">
            <strong>Now Playing:</strong> Please select a song
        </div>

        <div class="style-options">
            <span>Available styles:</span>
            <button onclick="setStyle('list')">List</button>
            <button onclick="setStyle('palette')">Palette</button>
            <button onclick="setStyle('map')">Map</button>
        </div>

        <div class="filters">
            <select id="regionFilter">
                <option value="all">All Regions</option>
                <!-- We will populate this dynamically later -->
            </select>
            <select id="genreFilter">
                <option value="all">All Genres</option>
                <!-- Optional future filters -->
            </select>
        </div>

        <div id="content">
            <!-- Dynamic content will render here -->
        </div>
    </div>
    <script src="renders.js"></script>
    <script>
        function setStyle(style) {
            switch(style) {
                case 'list':
                    renderListView();
                    break;
                case 'palette':
                    renderPaletteView();
                    break;
                case 'map':
                    renderMapView();
                    break;
            }
        }
        
        function playSong(song) {
            const nowPlaying = document.querySelector(".now-playing");
            nowPlaying.innerHTML = `<strong>Now Playing:</strong> ${song.city}`;
            // Implement audio player behavior here
        }
        </script>
        
    
</body>
</html>
