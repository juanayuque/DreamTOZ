<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Updates</title>
    <style>
        #shoutbox {
            width: 400px;
            height: 400px;
            border: 1px solid #ccc;
            overflow-y: auto;
            padding: 10px;
        }
        .message {
            padding: 5px;
            border-bottom: 1px solid #ddd;
        }
    </style>
</head>
<body>

    <h3>Live Flight Updates</h3>
    <div id="shoutbox"></div>

    <script>
        const apiKey = "5b9cb6afa7afb3b523b773d53208782c"; // Replace with your API key
        const apiUrl = `https://api.aviationstack.com/v1/flights?access_key=${apiKey}`; // Replace with your API URL

        async function fetchFlights() {
            try {
                const response = await fetch(apiUrl);
                const data = await response.json();
                const flights = data.data; // Adjust this based on your API response
                const shoutbox = document.getElementById("shoutbox");
                shoutbox.innerHTML = ""; // Clear before updating

                flights.slice(0, 10).forEach(flight => {
                    const div = document.createElement("div");
                    div.className = "message";
                    div.textContent = `${flight.airline.name} - ${flight.flight.iata}: ${flight.departure.iata} ➝ ${flight.arrival.iata} (${flight.flight_status})`;
                    shoutbox.appendChild(div);
                });

                // Auto-scroll to bottom
                shoutbox.scrollTop = shoutbox.scrollHeight;
            } catch (error) {
                console.error("Error fetching flight data:", error);
            }
        }

        // Auto-refresh every 10 seconds
        setInterval(fetchFlights, 1000);
        fetchFlights(); // Initial load
    </script>

</body>
</html>
